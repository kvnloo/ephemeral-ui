<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intel suite harness</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="fleet.css"><link rel="stylesheet" href="intel.css">
<style>body{margin:0;padding:24px;background:var(--h-bg)} #stage{display:grid;justify-content:center} #stage>.cell{width:min(var(--w,1100px),calc(100vw - 48px));min-width:0} @media(max-width:520px){body{padding:12px}#stage>.cell{width:min(var(--w,1100px),calc(100vw - 24px))}}</style>
</head><body><div id="stage"></div>
<script type="module">
// Harness: intel.html?tab=0..4&w=1100 . Sets html.ready when mounted; window.__intel.intents collects eui:intent.
import { loadApps, catalog } from "./js/shell.js";
import { loadThemes } from "./js/themes.js";
import { KINDS_INTEL, INTEL_APPS } from "./js/intel-suite.js";
await loadThemes(); await loadApps();
const q = new URLSearchParams(location.search), stage = document.getElementById("stage");
// ?theme=ruins : film palette sampled from the live Ruins wallpaper (films/glide-hackathon-v3/src/theme.json). Solid card, no see-through.
const THEMES = { ruins: { "--h-bg": "transparent", "--h-card": "#0f1e1a", "--h-card-solid": "#0f1e1a", "--h-muted": "#16281f", "--h-input": "#1d2e2a",
  "--h-border": "rgba(217,194,126,.20)", "--h-fg": "#eef3ec", "--h-mutedFg": "#a8bbb2", "--h-primary": "#d9c27e", "--h-primaryFg": "#0d1a17",
  "--h-accent": "#27402f", "--h-success": "#7db84a", "--h-warning": "#e3a94e", "--h-danger": "#e0795e" } };
for (const [k, v] of Object.entries(THEMES[q.get("theme")] || {})) document.documentElement.style.setProperty(k, v);
if (q.get("w")) stage.style.setProperty("--w", q.get("w") + "px");
window.__intel = { intents: [] };
document.addEventListener("eui:intent", e => window.__intel.intents.push(e.detail));
const id = INTEL_APPS["intel-suite"], a = catalog.byId[id] || { id, name: "Glide", hex: "#e6cd96" };
const c = KINDS_INTEL["intel-suite"].make(a, null, { demo: true }, { tab: +(q.get("tab") || 0) });
const cell = document.createElement("div"); cell.className = "cell"; cell.append(c.el); stage.append(cell); window.__intel.card = c;
document.documentElement.classList.add("ready");
</script></body></html>
