<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card demos · ephemeral-ui</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="trace.css">
<link rel="stylesheet" href="intent.css">
<link rel="stylesheet" href="fleet.css">
<link rel="stylesheet" href="fleet-hosts.css">
<link rel="stylesheet" href="fleet-pm.css">
<link rel="stylesheet" href="fleet-factory.css">
<link rel="stylesheet" href="intel.css">
<link rel="stylesheet" href="stats.css">
<link rel="stylesheet" href="ops.css">
<link rel="stylesheet" href="cua.css">
<link rel="stylesheet" href="gev.css">
<link rel="stylesheet" href="dock.css">
<link rel="stylesheet" href="demos.css">
<script type="module" src="js/demos.js"></script>
</head>
<body>
<main class="demo-page">
  <a href="./#kinds">← Back to the kit</a>
  <header>
    <span class="kicker">Ephemeral UI · live gallery</span>
    <h1>Card demos</h1>
    <p class="dim">Try any card on its own, with example or sanitized data. No agent is connected; actions stay in the demo.</p>
  </header>
  <p id="demo-status" role="status">Loading demos…</p>
  <section id="demo-section" hidden aria-labelledby="demo-title">
    <div class="demo-toolbar">
      <h2 id="demo-title"></h2>
      <button type="button" class="eu-btn ghost" id="demo-replay">Replay demo</button>
    </div>
    <fieldset id="demo-brand" class="demo-brand">
      <legend>Card appearance</legend>
      <label><input type="radio" name="brand" value="mono"> Bare (host only)</label>
      <label><input type="radio" name="brand" value="full"> Full brand</label>
    </fieldset>
    <p class="dim" id="demo-skin" hidden></p>
    <div id="demo-mount"></div>
    <div id="demo-dock"></div>
  </section>
  <nav aria-labelledby="demo-index-title">
    <h2 id="demo-index-title">Browse all card kinds</h2>
    <ul id="demo-index" class="demo-index"></ul>
  </nav>
</main>
</body>
</html>
