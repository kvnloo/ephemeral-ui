name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # catalog/catalog.json must be what the kind modules generate (see catalog/README.md)
      - run: node tools/card-catalog.mjs --check
      - run: node --test tools/*.test.mjs
